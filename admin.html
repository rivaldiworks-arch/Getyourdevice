<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Admin — getyourdevice</title>
  <link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./site.webmanifest">
  <meta name="theme-color" content="#1446A0">
</head>
<body class="admin-body">
  <main class="admin-shell">
    <section id="loginView" class="login-card">
      <a class="admin-brand" href="./index.html"><span class="brand-mark" aria-hidden="true">gyd</span><span class="logo"><span class="a">getyour</span><span class="b">device</span></span></a>
      <p class="eyebrow">ADMIN PORTAL</p><h1 id="loginTitle">Masuk ke dashboard</h1><p id="loginSubtitle">Gunakan akun yang telah diberi role <strong>admin</strong>.</p>
      <form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><div class="label-row"><label for="password">Password</label><button id="forgotPasswordLink" class="text-link" type="button">Lupa password?</button></div><div class="password-field"><input id="password" type="password" autocomplete="current-password" required minlength="6"><button class="password-toggle" type="button" data-toggle-password="password" aria-controls="password" aria-pressed="false" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="eye-open" d="M12 5C6.5 5 2.7 9.4 1.5 12c1.2 2.6 5 7 10.5 7s9.3-4.4 10.5-7C21.3 9.4 17.5 5 12 5Zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9Zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/><path class="eye-closed" d="M3.3 2 2 3.3l3.2 3.2C3.4 7.9 2.1 9.9 1.5 12c1.2 2.6 5 7 10.5 7 1.9 0 3.6-.5 5-1.3l3.7 3.7 1.3-1.3L3.3 2Zm8.7 14.5A4.5 4.5 0 0 1 7.5 12c0-.8.2-1.5.6-2.2l1.5 1.5a2.5 2.5 0 0 0 3.1 3.1l1.5 1.5c-.7.4-1.4.6-2.2.6ZM12 5c-1.3 0-2.5.2-3.6.6l2 2c.5-.1 1-.1 1.6-.1a4.5 4.5 0 0 1 4.5 4.5c0 .5-.1 1.1-.2 1.6l3.2 3.2c1.4-1.2 2.4-2.6 3-3.8C21.3 9.4 17.5 5 12 5Z"/></svg></button></div><p id="loginError" class="admin-error hidden" role="alert"></p><p id="loginNotice" class="admin-notice hidden" role="status"></p><button class="primary full" type="submit">Masuk</button></form><form id="forgotForm" class="hidden"><label for="forgotEmail">Email</label><input id="forgotEmail" type="email" autocomplete="email" required><p id="forgotMessage" class="admin-notice hidden" role="status"></p><p id="forgotError" class="admin-error hidden" role="alert"></p><button class="primary full" type="submit">Kirim link reset</button><button class="text-link" type="button" data-back-to-login>← Kembali ke login</button></form><form id="resetForm" class="hidden" novalidate><label for="newPassword">Password baru</label><div class="password-field"><input id="newPassword" type="password" autocomplete="new-password" required minlength="12"><button class="password-toggle" type="button" data-toggle-password="newPassword" aria-controls="newPassword" aria-pressed="false" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="eye-open" d="M12 5C6.5 5 2.7 9.4 1.5 12c1.2 2.6 5 7 10.5 7s9.3-4.4 10.5-7C21.3 9.4 17.5 5 12 5Zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9Zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/><path class="eye-closed" d="M3.3 2 2 3.3l3.2 3.2C3.4 7.9 2.1 9.9 1.5 12c1.2 2.6 5 7 10.5 7 1.9 0 3.6-.5 5-1.3l3.7 3.7 1.3-1.3L3.3 2Zm8.7 14.5A4.5 4.5 0 0 1 7.5 12c0-.8.2-1.5.6-2.2l1.5 1.5a2.5 2.5 0 0 0 3.1 3.1l1.5 1.5c-.7.4-1.4.6-2.2.6ZM12 5c-1.3 0-2.5.2-3.6.6l2 2c.5-.1 1-.1 1.6-.1a4.5 4.5 0 0 1 4.5 4.5c0 .5-.1 1.1-.2 1.6l3.2 3.2c1.4-1.2 2.4-2.6 3-3.8C21.3 9.4 17.5 5 12 5Z"/></svg></button></div><label for="confirmPassword">Ulangi password baru</label><div class="password-field"><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="12"><button class="password-toggle" type="button" data-toggle-password="confirmPassword" aria-controls="confirmPassword" aria-pressed="false" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="eye-open" d="M12 5C6.5 5 2.7 9.4 1.5 12c1.2 2.6 5 7 10.5 7s9.3-4.4 10.5-7C21.3 9.4 17.5 5 12 5Zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9Zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/><path class="eye-closed" d="M3.3 2 2 3.3l3.2 3.2C3.4 7.9 2.1 9.9 1.5 12c1.2 2.6 5 7 10.5 7 1.9 0 3.6-.5 5-1.3l3.7 3.7 1.3-1.3L3.3 2Zm8.7 14.5A4.5 4.5 0 0 1 7.5 12c0-.8.2-1.5.6-2.2l1.5 1.5a2.5 2.5 0 0 0 3.1 3.1l1.5 1.5c-.7.4-1.4.6-2.2.6ZM12 5c-1.3 0-2.5.2-3.6.6l2 2c.5-.1 1-.1 1.6-.1a4.5 4.5 0 0 1 4.5 4.5c0 .5-.1 1.1-.2 1.6l3.2 3.2c1.4-1.2 2.4-2.6 3-3.8C21.3 9.4 17.5 5 12 5Z"/></svg></button></div><p id="resetError" class="admin-error hidden" role="alert"></p><button class="primary full" type="submit">Simpan password</button></form>
      <a href="./index.html">← Kembali ke toko</a>
    </section>
    <section id="dashboardView" class="dashboard hidden">
      <header class="admin-topbar"><div><a class="admin-brand" href="./index.html"><span class="brand-mark" aria-hidden="true">gyd</span><span class="logo"><span class="a">getyour</span><span class="b">device</span></span></a><small id="adminIdentity"></small></div><button id="signOut" class="secondary" type="button">Keluar</button></header>
      <div class="admin-heading"><div><p class="eyebrow">ADMIN DASHBOARD</p><h1>Kelola toko</h1></div><button id="addProduct" class="primary" type="button">+ Tambah produk</button></div>
      <nav class="admin-tabs"><button class="active" data-tab="products">Produk</button><button data-tab="orders">Pesanan</button></nav>
      <section id="productsPanel">
        <div class="admin-toolbar"><input id="productSearch" type="search" placeholder="Cari nama, brand, kategori…"><select id="statusFilter"><option value="all">Semua status</option><option value="active">Aktif</option><option value="inactive">Nonaktif</option></select></div>
        <p id="productMessage" class="admin-message" role="status"></p><div id="productTable" class="admin-table-wrap"></div>
      </section>
      <section id="ordersPanel" class="hidden">
        <div class="admin-toolbar"><input id="orderSearch" type="search" placeholder="Cari nomor pesanan atau pelanggan…"><select id="orderStatusFilter"><option value="all">Semua status</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="processing">Processing</option><option value="shipped">Shipped</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div>
        <p id="orderMessage" class="admin-message" role="status"></p><div id="orderTable" class="admin-table-wrap"></div>
      </section>
    </section>
  </main>
  <dialog id="productDialog"><form id="productForm"><div class="dialog-head"><h2 id="formTitle">Tambah produk</h2><button type="button" id="closeDialog" aria-label="Tutup">×</button></div><input id="productId" type="hidden"><div class="form-grid"><label>Nama<input id="name" required></label><label>Brand<input id="brand" required></label><label>Kategori<input id="category" required></label><label>Harga<input id="price" type="number" min="0" step="1" required></label><label>Harga asli<input id="originalPrice" type="number" min="0" step="1"></label><label>Stok<input id="stock" type="number" min="0" step="1" required></label><label>Rating<input id="rating" type="number" min="0" max="5" step="0.1"></label><label>Berat paket (gram)<input id="weightGrams" type="number" min="1" step="1" placeholder="Contoh: 500"><small>Isi saat data fisik produk sudah diketahui.</small></label><label>Panjang paket (cm)<input id="lengthCm" type="number" min="0.1" step="0.1" placeholder="Contoh: 20"></label><label>Lebar paket (cm)<input id="widthCm" type="number" min="0.1" step="0.1" placeholder="Contoh: 12"></label><label>Tinggi paket (cm)<input id="heightCm" type="number" min="0.1" step="0.1" placeholder="Contoh: 8"></label><label>URL gambar yang sudah ada<input id="imageUrl" type="url" placeholder="https://…"></label><label class="wide image-picker">Unggah gambar baru<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG, atau WebP. Maksimal 5 MB. Kosongkan untuk mempertahankan gambar saat ini.</small><span id="imagePreviewEmpty">Belum ada gambar.</span><img id="imagePreview" class="hidden" alt="Pratinjau gambar produk"></label><label class="wide">Deskripsi<textarea id="description" rows="3"></textarea></label><label class="wide">Spesifikasi (JSON)<textarea id="specifications" rows="4">{}</textarea></label><label class="check wide"><input id="isActive" type="checkbox" checked> Produk aktif dan terlihat di storefront</label></div><p id="formError" class="admin-error hidden" role="alert"></p><div class="dialog-actions"><button id="cancelDialog" class="secondary" type="button">Batal</button><button id="saveProductButton" class="primary" type="submit">Simpan</button></div></form></dialog>
  <dialog id="orderDialog" class="order-dialog"><div class="order-dialog-body"><div class="dialog-head"><div><p class="eyebrow">DETAIL PESANAN</p><h2 id="orderDetailTitle">Pesanan</h2></div><button type="button" id="closeOrderDialog" aria-label="Tutup">×</button></div><div id="orderDetailContent"></div></div></dialog>
  <div id="adminToast" class="toast hidden" role="status"></div><div id="printArea" class="print-area" aria-hidden="true"></div><script src="./shipping-label.js"></script><script src="./admin.js"></script>
</body></html>
